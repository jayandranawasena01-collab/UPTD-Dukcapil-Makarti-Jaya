<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>UPTD Dukcapil Makarti Jaya</title>
    <link rel="icon" href="https://drive.google.com/uc?export=view&id=19TwjITIo5eiYf4zUWqjWYeRDfb1xT-pN" />
    <!-- Kode PWA untuk Manifest dan Service Worker -->
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Memastikan Service Worker hanya didaftarkan pada protokol yang didukung (http/https)
                if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
                    navigator.serviceWorker.register('sw.js').catch((error) => {
                        console.log('Pendaftaran ServiceWorker gagal: ', error);
                    });
                } else {
                    console.log('Pendaftaran ServiceWorker dilewati karena berjalan di lingkungan lokal/preview.');
                }
            });
        }
    </script>

    <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden; /* Mencegah scroll ganda */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh; /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbxyADGLHn4cpnZaOQEiW-aWinprH8y2VxFCmo5mhYacwihIQ34c6cq3xCzYhtAyhm1_/exec"
      scrolling="yes"
      allowfullscreen="true"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>
</body>
</html>
